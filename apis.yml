aid: novakid
name: Novakid
description: >-
  Novakid is an online English language school for children aged roughly 4-12, founded in 2017 by
  Max Azarov and Dmitry Malin, incorporated in the United States and operating as a fully remote
  company with a head office in London. It delivers 25-minute one-to-one and small-group video
  lessons with native and near-native speaking teachers through a proprietary gamified virtual
  classroom, on a curriculum aligned to the CEFR framework, and sells directly to parents as a
  subscription across Europe, Latin America, the Middle East and Asia. Novakid is a
  direct-to-consumer education product: as of this profile it publishes no developer portal, no
  API reference, no SDKs and no machine-readable API contract of any kind, and its production API
  host serves a blanket robots.txt disallow.
